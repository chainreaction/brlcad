# BRL-CAD on Termux — tmux configuration
#
# Use it with:  tmux -f misc/termux/tmux.conf   (or copy it to ~/.tmux.conf)
#
# Two settings matter specifically for this workflow:
#   * extended-keys / csi-u — without it tmux reports Shift+Enter, Ctrl+Enter
#     and Enter as the same key, which breaks agent TUIs (e.g. pi, see its
#     docs/tmux.md).  Requires tmux >= 3.5.
#   * a large history-limit — build, raytrace and g-stl output is long.

set -g extended-keys on
set -g extended-keys-format csi-u

set -g history-limit 100000

# Termux has no mouse-friendly window manager; let tmux handle the mouse.
set -g mouse on

# Keep window numbering stable; renumber removes gaps after closing a window.
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right "%H:%M"
